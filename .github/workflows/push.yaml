name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  push:
    branches:
      - master
      - main
      - 'release/**'
    tags:
      - '*'
  # Release ohne Tag-Push: baut den aktuellen Stand und legt Tag (Version aus buildspec.json) und Entwurf an
  workflow_dispatch:
    inputs:
      release:
        description: Release mit der Version aus buildspec.json erstellen
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  check-format:
    name: Check Formatting 🔍
    if: github.ref_name == 'master' || github.ref_name == 'main'
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    with:
      release: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    secrets: inherit
    permissions:
      contents: read

  create-release:
    name: Create Release 🛫
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-24.04
    needs: build-project
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes

      - name: Check Release Tag ☑️
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : Check Release Tag ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          # Per Knopf gestartet: Version aus buildspec.json, der Tag entsteht mit dem Release
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != 'tag' ]]; then
            version="$(jq -r '.version' buildspec.json)"
            if git ls-remote --exit-code --tags origin "refs/tags/${version}" > /dev/null; then
              echo "::error::Tag ${version} existiert schon – Version in buildspec.json erhöhen"
              exit 1
            fi
          fi

          # Beim Veröffentlichen eines per Knopf erstellten Entwurfs legt GitHub den Tag an –
          # das Release gibt es dann schon und darf nicht neu gebaut oder überschrieben werden
          if [[ "${GITHUB_REF_TYPE}" == 'tag' ]] && gh release view "${version}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "Release ${version} existiert schon – nichts zu tun"
            echo 'validTag=false' >> $GITHUB_OUTPUT
            exit 0
          fi

          case "${version}" in
            +([0-9]).+([0-9]).+([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=false' >> $GITHUB_OUTPUT
              echo "version=${version}" >> $GITHUB_OUTPUT
              ;;
            +([0-9]).+([0-9]).+([0-9])-@(beta|rc)*([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=true' >> $GITHUB_OUTPUT
              echo "version=${version}" >> $GITHUB_OUTPUT
              ;;
            *) echo 'validTag=false' >> $GITHUB_OUTPUT ;;
          esac

      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@v4
        if: fromJSON(steps.check.outputs.validTag)
        id: download

      - name: Rename Files 🏷️
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Rename Files 🏷️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob
          shopt -s nullglob

          root_dir="$(pwd)"
          commit_hash="${GITHUB_SHA:0:9}"

          variants=(
            'windows-x64;zip|exe'
            'macos-universal;tar.xz|pkg'
            'ubuntu-24.04-x86_64;tar.xz|deb|ddeb|AppImage'
            'sources;tar.xz'
          )

          for variant_data in "${variants[@]}"; do
            IFS=';' read -r variant suffix <<< "${variant_data}"

            candidates=(*-${variant}-${commit_hash}/@(*|*-dbgsym).@(${suffix}))

            for candidate in "${candidates[@]}"; do
              mv "${candidate}" "${root_dir}"
            done
          done

      - name: Generate Checksums 🪪
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Generate Checksums 🪪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          # Release-Text aus .github/release-notes/<version>.md, darunter die Prüfsummen
          : > ${{ github.workspace }}/CHECKSUMS.txt
          notes="${{ github.workspace }}/.github/release-notes/${{ steps.check.outputs.version }}.md"
          if [[ -f "${notes}" ]]; then
            cat "${notes}" >> ${{ github.workspace }}/CHECKSUMS.txt
          fi
          echo "### Checksums" >> ${{ github.workspace }}/CHECKSUMS.txt
          for file in ${{ github.workspace }}/@(*.exe|*.deb|*.ddeb|*.pkg|*.tar.xz|*.zip|*.AppImage); do
            echo "    ${file##*/}: $(sha256sum "${file}" | cut -d " " -f 1)" >> ${{ github.workspace }}/CHECKSUMS.txt
          done

      - name: Create Release 🛫
        if: fromJSON(steps.check.outputs.validTag)
        id: create_release
        uses: softprops/action-gh-release@9d7c94cfd0a1f3ed45544c887983e9fa900f0564
        with:
          draft: true
          prerelease: ${{ fromJSON(steps.check.outputs.prerelease) }}
          tag_name: ${{ steps.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.build-project.outputs.pluginName }} ${{ steps.check.outputs.version }}
          body_path: ${{ github.workspace }}/CHECKSUMS.txt
          files: |
            ${{ github.workspace }}/*.exe
            ${{ github.workspace }}/*.zip
            ${{ github.workspace }}/*.pkg
            ${{ github.workspace }}/*.deb
            ${{ github.workspace }}/*.ddeb
            ${{ github.workspace }}/*.tar.xz
            ${{ github.workspace }}/*.AppImage
